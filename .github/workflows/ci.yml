name: CI Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-validation:
    name: Repo validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test bounded hosted contracts
        run: npm run test:hosted-contract-follow-up

      - name: Test post-303 Stage A boundaries
        run: npm run test:post-303-stage-a-boundaries

      - name: Test post-304 delayed review boundaries
        run: npm run test:post-304-delayed-review

      - name: Test post-merge review remediation workflow contract
        working-directory: website
        run: npm run test:remediation-workflow-contract

      - name: Validate Stage A OAuth readiness
        run: npm run validate:stage-a-oauth-readiness

      - name: Validate preview approval package
        run: npm run validate:preview-approval-package

      - name: Validate preview smoke harness
        run: npm run validate:preview-smoke-harness

      - name: Validate preview handoff
        run: npm run validate:preview-handoff

      - name: Validate local release candidate
        run: npm run validate:local-release-candidate

      - name: Validate Supabase migration scaffold
        run: npm run validate:supabase-migrations

      - name: Test Supabase migration validator
        run: npm run test:supabase-migrations

      - name: Run Supabase RLS/schema tests
        run: npm run test:supabase-rls

      - name: Install website dependencies for Run-49 joined integration
        working-directory: website
        run: npm ci

      - name: Test Run-49 async child-process harness
        run: npm run test:run-49-child-process

      - name: Test Run-49 joined receipt diagnostics
        run: npm run test:run-49-receipt

      - name: Test Run-52 end-to-end joined receipt contract
        run: npm run test:run-52-receipt-e2e

      - name: Test Run-53 joined bootstrap diagnostics
        run: npm run test:run-53-bootstrap

      - name: Test Run-54 session/client/runner diagnostics
        run: npm run test:run-54-session-client-runner

      - name: Run Run-54 seven-case PostgreSQL/PostgREST integration
        run: npm run test:run-49-joined-postgres

      - name: Validate n8n workflow exports
        if: always()
        run: npm run validate:n8n

      - name: Test n8n validation rules
        if: always()
        run: npm run test:n8n-validation

  exact-head-production-audit:
    name: Exact-head production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Self-test production dependency audit validator
        working-directory: website
        run: npm run validate:production-audit-self-test

      - name: Test production audit ordering, digest and evidence sealing
        working-directory: website
        run: npm run test:production-audit-remediation

      - name: Test production audit upload admission
        working-directory: website
        run: npm run test:production-audit-upload-admission

      - name: Create private audit evidence directory
        id: audit-path
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/production-dependency-audit.XXXXXXXXXX")"
          chmod 700 "$audit_dir"
          evidence_path="${audit_dir}/production-dependency-audit-evidence.json"
          admission_path="${audit_dir}/production-dependency-audit-upload-admission.json"
          admission_challenge="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${admission_challenge}"
          echo "evidence=${evidence_path}" >> "$GITHUB_OUTPUT"
          echo "admission=${admission_path}" >> "$GITHUB_OUTPUT"
          echo "challenge=${admission_challenge}" >> "$GITHUB_OUTPUT"

      - name: Enforce zero production dependency vulnerabilities
        id: production-audit
        working-directory: website
        shell: bash
        env:
          EXPECTED_AUDIT_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          node scripts/validate-production-audit.cjs \
            --baseline security/production-dependency-audit-baseline.json \
            --evidence-output "${{ steps.audit-path.outputs.evidence }}" \
            --admission-output "${{ steps.audit-path.outputs.admission }}" \
            --admission-challenge "${{ steps.audit-path.outputs.challenge }}"
          audit_status="$?"
          set -e
          echo "status=${audit_status}" >> "$GITHUB_OUTPUT"

      - name: Verify production audit upload admission
        id: audit-admission
        if: always()
        working-directory: website
        env:
          EXPECTED_AUDIT_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/validate-production-audit.cjs
          --verify-upload-admission
          --evidence-output "${{ steps.audit-path.outputs.evidence }}"
          --admission-output "${{ steps.audit-path.outputs.admission }}"
          --admission-challenge "${{ steps.audit-path.outputs.challenge }}"

      - name: Upload production dependency audit evidence
        if: steps.audit-admission.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.audit-path.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production audit and admission outcomes
        if: always()
        shell: bash
        env:
          AUDIT_STATUS: ${{ steps.production-audit.outputs.status }}
          ADMISSION_OUTCOME: ${{ steps.audit-admission.outcome }}
        run: |
          set -euo pipefail
          test "$AUDIT_STATUS" = "0"
          test "$ADMISSION_OUTCOME" = "success"

  website-validation:
    name: Website validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Test sharp parent and worker lifecycle
        working-directory: website
        run: npm run test:sharp-native-lifecycle

      - name: Validate Linux sharp native image operation
        working-directory: website
        run: npm run test:sharp-native

      - name: Run website tests
        working-directory: website
        run: npm run test

      - name: Run website typecheck
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build

  tracked-file-safety:
    name: Tracked file safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          fi

      - name: Check forbidden tracked local/runtime files
        shell: bash
        run: |
          set -euo pipefail

          found=0

          forbidden_paths=(
            "website/chat-config.js"
            "website/chat-config.local.js"
            ".env"
            ".env.local"
            ".env.development"
            ".env.production"
            ".env.test"
            "website/.env"
            "website/.env.local"
            "website/.env.development"
            "website/.env.production"
            "website/.env.test"
          )

          for path in "${forbidden_paths[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Forbidden tracked file detected: $path"
              found=1
            fi
          done

          runtime_dirs="$(git ls-files ".n8n-local" ".tmp" "website/.tmp")"
          if [ -n "$runtime_dirs" ]; then
            echo "Forbidden tracked runtime directory content detected."
            found=1
          fi

          forbidden_patterns=(
            "n8n-credential-bindings*.json"
            "*credential-bindings*.json"
            "*credentials-export*.json"
            "*live-credential*.json"
            "credentials.*"
            "credential.*"
            "secrets.*"
            "secret.*"
            "tokens.*"
            "token.*"
            "*.credentials"
            "*.credential"
            "*.secrets"
            "*.secret"
            "*.tokens"
            "*.token"
          )

          for pattern in "${forbidden_patterns[@]}"; do
            if [ -n "$(git ls-files "$pattern")" ]; then
              echo "Forbidden tracked credential/secret file pattern detected: $pattern"
              found=1
            fi
          done

          exit "$found"
